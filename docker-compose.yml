# 轻量容器化：只托管 MySQL（本地开发最麻烦的依赖）。
# API 与前端仍用 npm run dev:all 本地起；完整容器化待部署阶段再做。
# 用法：docker compose up -d && npm install && npm run db:seed && npm run dev:all
services:
  db:
    image: mysql:8.4
    container_name: ruankao-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"   # 本地开发：root 空密码，与 server/ 默认配置一致
      MYSQL_DATABASE: ruankao
    ports:
      - "3306:3306"
    volumes:
      - rk-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rk-mysql-data:
